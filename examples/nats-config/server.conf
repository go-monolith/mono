# NATS Server Configuration File
# This config file demonstrates settings that can be loaded via WithNATSConfigFile()
#
# Note: Programmatic options (WithNATSPort, WithNATSHost, etc.) take precedence
# over settings in this file. This allows you to use a standard config file
# while overriding specific settings at runtime.

# Server identification
server_name: mono-nats-example

# Client connection settings
# These can be overridden by WithNATSPort() and WithNATSHost()
port: 4222
host: 127.0.0.1

# HTTP monitoring endpoint (disabled by default)
# http_port: 8222

# Maximum payload size (1MB default)
max_payload: 1048576

# Connection limits
max_connections: 1024

# Debug and trace logging (disabled for production)
debug: false
trace: false

# JetStream configuration
jetstream {
    # Storage directory for JetStream data
    # When empty, uses temporary directory (suitable for development)
    store_dir: ""

    # Maximum memory for JetStream streams
    max_memory_store: 268435456  # 256MB

    # Maximum file storage for JetStream streams
    max_file_store: 1073741824   # 1GB
}

# Cluster configuration (commented out - single node by default)
# cluster {
#     name: mono-cluster
#     listen: 0.0.0.0:6222
#     routes: [
#         nats://node1:6222
#         nats://node2:6222
#     ]
# }

# Leaf node configuration (commented out)
# leafnodes {
#     port: 7422
# }

# Authorization (commented out - no auth by default)
# authorization {
#     user: admin
#     password: secret
# }
